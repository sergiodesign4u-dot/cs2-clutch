<!-- NODE 4.1 STEP 2, THE MONEY, for every route that takes an amount, D-96.
     Base state: an account, no saved method, first deposit, card chosen.
     THIS PAGE IS THE OLD 4.1 WITH ITS METHOD BLOCK REMOVED, and the removal is the
     decision rather than a tidy-up. The node's order was amount, then the two
     brakes, then the method, against the category's method-then-amount, on the
     ground that the ceiling is pre-filled from the amount so a method chosen
     first makes the ceiling arrive as an interruption at the end.
     THE ARGUMENT DID NOT SURVIVE THE REAL METHOD LIST AND THE REASON IS NOT TASTE.
     Crypto has no amount field at all: the person sends what they send and the
     rate at the top converts it, baseline-account.md 5b.3. So on a third of the
     routes there is no amount to pre-fill a ceiling from, and asking for one
     before the route is chosen produces a screen that has to be taken back.
     WHAT THE OLD ARGUMENT WAS PROTECTING IS KEPT BY PLACEMENT INSTEAD. The ceiling
     sits directly under the amount, before the pay control, so it still arrives
     while a person is deciding rather than at the end while they are committing.
     The worry was never the global order; it was the ceiling appearing last.
     THIS CLUSTER CLOSES NO JOB AND SAYS SO. Its parents are three barriers: money
     that leaves and never arrives, a withdrawal threshold that rose while the
     person kept depositing to reach it, and the escalation loop. -->
