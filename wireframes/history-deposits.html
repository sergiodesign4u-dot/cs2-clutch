<!-- NODE 5.9, HISTORY, DEPOSITS. Base state: payments exist. One of the four
     peer pages of this node since D-89, and it has an address of its own
     precisely so that its states can have addresses too.
     THE PARENT IS THE BARRIER WHERE MONEY LEAVES AND DOES NOT ARRIVE. B4-3 on
     the As-Is map, a pattern of 4 across 3 platforms, ledger U-04. The shortest
     of the four carries the whole thing in one voice: "I've deposited $25
     through Crypto, nothing. I've waited a few hours, nothing... The ticket is
     closed, still $0 added to balance".
     READ IT FOR WHAT IT IS ACTUALLY ABOUT. The 25 dollars is the smaller half.
     The larger half is that there is nowhere to look. A bank statement on one
     side, a balance on the other, and no object in between that either agrees
     with them or contradicts them. The ticket closing without the balance moving
     is the same absence a second time, and that second time is where the review
     gets written.
     A LEDGER IS THE ANSWER TO THAT, AND IT IS A CHEAP ONE. Every attempt this
     account has made, the ones that arrived and the ones that did not, with our
     reference and the processor's reference in the same row. That pairing is the
     working part: it lets a person put a row beside a bank line, and support put
     a ticket beside a row, without either of them guessing which payment is
     being discussed.
     EVERY ROW THAT FAILED SAYS WHY IT FAILED IN THE ROW, never in a tooltip and
     never behind a hover. A refusal whose ground lives only in a hover has no
     ground at all on a phone, and a phone is where this page gets opened, at the
     moment the person is angriest. The renderer puts the reason inside the state
     cell rather than beside it, so no layout can separate the two.
     FIVE ROWS, CHOSEN SO THE STATES ARE ON THE PAGE RATHER THAN IN A LIST
     SOMEWHERE ELSE. Complete twice, because most payments are and a ledger of
     nothing but disasters misrepresents the product, then the three that
     generate tickets: refused by the bank, still crediting on the network, and
     refused by the person's own deposit ceiling.
     THE CEILING ROW IS THE ONE THAT MATTERS MOST AND IT IS OURS, NOT THE BANK'S.
     It names which limit and how much of it was already used, because a limit
     that blocks in silence cannot be told apart from a broken payment, and a
     person who reads it as broken writes to support about the wrong thing and
     loses the protection at the same time. Naming it also keeps the limit a
     boundary rather than a score: it reports a refusal, it does not congratulate
     anyone for approaching one.
     A ROW THAT NEVER GOT A PROCESSOR REFERENCE SAYS SO IN WORDS RATHER THAN
     LEAVING A BLANK CELL. Missing is a state, never a zero.
     NO TOTAL DEPOSITED, NO MONTHLY CHART, NO NET FIGURE. Same rule the rolls
     page runs on: a lifetime figure of what this has cost is a session score
     with a longer window. The cost of that is printed rather than absorbed. A
     person who wants to know what they have put in across the year cannot learn
     it here, and that is the correct loss.
     AMOUNTS ARE IN COINS AND THE NOTE SAYS WHAT THAT MEANS. It read: until the
     peg is published a row cannot be reconciled against a bank statement in the
     strict sense. THE PEG IS PUBLISHED SINCE D-95 AND IT IS ONE TO ONE, so the
     obstacle is gone and a row lines up with a statement.
     AND THE BONUS OPENED A HOLE IN THE SAME BREATH, D-94. A payment of 40 dollars
     credits 42 coins, so the money charged and the coins credited stopped being
     one number, and a ledger with one amount column cannot be both. WHICH ONE A
     ROW HOLDS IS NOT DECIDED, and the panel says so rather than picking one and
     being wrong on every bonused row. A closure that opens a smaller hole gets
     the hole written down, D-92's own lesson applied one node over. -->
