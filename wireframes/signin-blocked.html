  <!-- NODE 2.4, THE ADDRESS CARRIER, D-54 of 21 August 2026.
       The founder made this node a dialog. THE ADDRESS SURVIVED THE CHANGE OF
       CARRIER, and this page is it: the cold arrival for a typed URL, a deep
       link, a session with no script, a crawler, and the node's own "already
       signed in" state, which exists precisely because a person can type it.
       Deleting the address would have silently deleted four reasoned rules from
       the node's SEO checklist E: that noindex is a meta tag readable at a URL,
       that the route back is a crawlable anchor, that the statement is text
       rather than an image, and that the surface is identical for a person and a
       crawler. A rule stops applying by decision, never as a side effect.
       ONE CONTENT, TWO CARRIERS, and neither is a reduced version of the other.
       The card is built once in _nav.js and mounted from there, because six
       copies of one statement is how five of them rot and the shortest becomes
       the real one.
       WHAT THIS CARRIER HAS THAT THE DIALOG DOES NOT: the H1, the H2 outline, the
       footer 0.2, and block 6 as a real link. The dialog carries no H1 because
       the host page owns that outline, no footer because the surface behind it
       already has one, and no block 6 link because the dismissal is block 6.
       PRESS REFUSED, D-58. A person pressed a provider without declaring, and this is
       the answer. NOT ONE CONTROL ON THIS SURFACE IS DISABLED, in any state.
       A dead control answers "why not" with nothing: a person arrives, finds it
       unavailable, cannot see what to do, and either leaves or writes to
       support. Four dead controls in a row is that four times over.
       WHAT D-26 REQUIRES IS UNCHANGED AND IS ENFORCED HERE: the press does not
       sign anyone in. The baseline's defect was that its provider buttons WORKED
       with the box unticked; these do not. What changed is the answer.
       THREE THINGS HAPPEN ON THE PRESS: the declarations that are missing are
       marked on themselves, the line names which one, and the keyboard goes to
       the first of them. A message about a control somewhere above is a message
       a person has to go and find. -->
