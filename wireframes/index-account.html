<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open CS2 cases with published odds and payout times</title>
  <!-- Node 1.1. The same page as 1.0 in a different account state. A crawler is never
       signed in, so the indexed render of / is always the guest render: 1.1 needs no
       meta of its own. home.md section 4.2. -->
  <meta name="description" content="Every case shows the chance and current value of each item, plus tested RTP and expected value at that cost. Withdrawals go to Steam, commission free.">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="_wf.css">
</head>
<body>

<!-- The wireframe-only side panel. Rendered by wireframes/_nav.js. Screens and states
     only: the roadmap lives on overview.html. No status strip above the screen. -->
<button class="wfp-toggle" type="button" aria-label="Screens and states" aria-expanded="false">≡</button>
<aside id="wf-panel"></aside>

<div class="wf-screen-body">

  <!-- 0.1 NAVIGATION and 0.2 FOOTER are globals, rendered once by wireframes/_nav.js
       from window.WF_SHELL. Step 5: nobody redraws the header per screen. -->
  <div class="wf-shell" id="wf-shell"></div>

  <main class="wf-main">

    <!-- NODE 1.0 and 1.1, D-126: rendered once by homeBody() in _nav.js on Home, Home
         with an account and the eight cookie states. Order, blocks and reasons are
         in that function and in ia/docs/pages/home.md. -->
    <div data-home-body="account"></div>

  </main>

  <footer class="wf-footer" id="wf-footer"></footer>

  <nav class="wf-bar" id="wf-bar"></nav>

</div>

<script>
window.WF_BASE = '';
window.WF_IA_BASE = '../ia/';
window.WF_SHELL = { account: true, active: 'index.html', feedTop: true };
</script>
<script src="_nav.js"></script>
</body>
</html>
