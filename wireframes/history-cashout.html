<!-- HISTORY, CASH OUT. THE TAB HAS A SUBJECT SINCE D-93 AND IT IS NOT THE ONE
     ITS LABEL SOUNDS LIKE: selling an item back for coins.
     WHAT THE FOUNDER DECIDED, 24 August 2026. Selling a skin back for coins is
     round 1 since D-38, it is the only movement of money on this product with no
     ledger anywhere, and this tab is exactly its shape. So the fourth tab keeps
     the baseline's label and gains our subject.
     THE ARGUMENT THIS PAGE SHIPPED WITH IS SUPERSEDED, NOT DELETED, AND IT WAS
     RIGHT ON A WRONG PREMISE. On D-88 this page shipped as a rendered absence:
     "turning coins back into money is not a capability anywhere in the backlog,
     and the only capture of this tab on the live product is empty, so the
     baseline cannot say what a row of it would hold." Both halves of that are
     still true. What was wrong is the conclusion that the tab therefore had no
     subject. THE SUBJECT WAS ONE PAGE OVER THE WHOLE TIME and this very page
     named it: "selling an item back for coins, which does exist, is in round 1,
     and is already recorded one page over on the roll the item came from."
     A MARK ON A ROLL IS NOT A RECORD OF A SALE. The Rolls tab prints "Sold back,
     21 Aug" on the item, which is a fact about the roll: it says the thing you
     won is gone and why. It does not say what the sale credited, when it settled
     or under what reference, and a person reconciling their balance cannot get
     any of those from it. That is the hole D-93 closes.
     BOTH READINGS STILL HAVE TO BE ON THE PAGE, because the label still says
     Cash out. Taking a balance out as money is not built, and the coin has no
     published rate to do it at, so that reading is stated in one line under the
     bar and never performed. A tab that gained a subject and dropped the reading
     its label carries would be a promise nobody made.
     NEVER "History is empty...", the string two nodes of this project refuse by
     name, and the empty state of this tab is its own page now rather than this
     one, since there is an act that fills it and therefore a route to offer.
     ONE ROW, AND THAT IS NOT A THIN DEMO. The corpus holds exactly one sell back,
     the P250 on the Rolls tab and on 7.3, and this ledger holds exactly that one.
     A second invented row would be a sale no other surface has ever heard of. -->
