<!-- HISTORY, CASH OUT. A TAB WITH NO SUBJECT ON OUR MAP, SHIPPING AS THE
     STATEMENT THAT IT HAS NONE.
     TURNING COINS BACK INTO MONEY IS NOT A CAPABILITY ANYWHERE IN THE BACKLOG.
     Not in the MVP rows, not in the LATER list, not carried anywhere as a
     deferred capability with a parent. It is absent, and absent is a different
     thing from postponed.
     AND THE SOURCE CANNOT HELP EITHER. The only capture of this tab on the live
     product is empty, so the baseline cannot say what a row of it would hold: no
     columns, no states, no example of one. Reconstructing a plausible table from
     what the label sounds like is exactly the median the input gate exists to
     prevent, and it would read as knowledge right up until someone asked where
     it came from.
     SO IT SHIPS AS A RENDERED ABSENCE, AND THE ABSENCE NAMES BOTH READINGS.
     Taking a balance out as money, which nothing on this product does and which
     the coin could not even be priced for while the peg is unpublished; and
     selling an item back for coins, which does exist, is in round 1, and is
     already recorded one page over on the roll the item came from. Naming the
     second is the part that does real work: without it, a person who has sold
     something back concludes, reasonably, that the record is missing.
     NEVER "History is empty...", the string two nodes of this project refuse by
     name. It is the sentence that tells a person nothing while looking like an
     answer, and on a tab whose emptiness has a cause it is a lie of omission. A
     tab that only says it is empty cannot be told apart from one that is broken.
     THE DIFFERENCE BETWEEN A RENDERED ABSENCE AND A DEAD ITEM IS THAT A DEAD
     ITEM PROMISES SOMETHING. A dead item is a control that looks live or a
     destination with nothing behind it: it makes an offer and then fails to keep
     it. This page makes no offer at all. It is a carrier the baseline holds,
     filled with the true statement that we hold nothing for it.
     WHY IT IS NOT SIMPLY DELETED. The argument for three tabs was put and lost:
     the founder chose all four of the baseline's. So the fourth ships, and what
     keeps it from being a defect is that it explains its own emptiness instead
     of performing it.
     NO EMPTY-STATE CONTROL HERE, DELIBERATELY. The other three empties offer a
     route because there is an act that would fill them. There is no act that
     fills this one, so a button would be the promise the rest of the page is
     careful not to make. -->
