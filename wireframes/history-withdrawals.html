<!-- NODE 5.9, HISTORY, WITHDRAWALS. Base state: items have been sent to Steam.
     THE PARENT IS THE BARRIER OF WAITING WITH NUMBERS. B8-2, six people in the
     ledger and every one of them turned up with a hard figure: 30 hours, 7 days,
     2 to 3 days, 9 days from the last deposit, 16 hours, almost 3 weeks. Ledger
     U-09.
     AND WHAT EVERY ONE OF THEM DESCRIBES IS SILENCE RATHER THAN SLOWNESS. The
     figures differ by two orders of magnitude and the complaint does not change
     shape across them, which is the finding rather than a detail of it. Nobody
     in that set says the platform is slow. They say they were told nothing while
     it was slow. The positive pole sits in the same ledger, a butterfly withdrawn
     in five minutes, so the category can do the fast version. What it cannot do
     is say where the item is.
     SO A ROW SAYS WHO IT IS WAITING ON AND HOW LONG IT HAS BEEN, AND IT NEVER
     ESTIMATES WHEN IT WILL FINISH. That is the same rule the withdrawal clock
     runs on one screen over: elapsed, the published ceiling, and the party being
     waited on. Three figures we can stand behind, and no fourth one we cannot.
     An invented ETA is a promise made by a system that does not control the
     thing it is promising about, and a history that printed one would contradict
     the screen it is a history of.
     NO ROW PRINTS A CEILING FIGURE, BECAUSE THIS REPOSITORY DOES NOT HOLD ONE.
     A first draft of these rows said "our published ceiling is 48 h" and the
     withdrawal clock renders every one of its ceilings as not published, which
     is a live [?]. That is the same defect the account band and the profile
     record had an hour earlier: two renderings of one fact, disagreeing. Nobody
     invents a number here. The rows say elapsed and who is being waited on, and
     where the ceiling belongs they say it is not set. This page invents no
     ceiling and does not quietly imply that one exists.
     THREE ROWS AND THEY ARE THE THREE ENDINGS. One in flight and still inside
     the ceiling, one accepted with the time it actually took, and one the person
     cancelled themselves. The third is here so that cancelled does not read as
     failed: it says who is being waited on and the answer is nobody.
     WORTH IS DATED TO THE MOMENT IT WAS SENT, like every other figure in this
     node. An item that moved in price afterwards would otherwise rewrite what
     every past withdrawal was worth, and a ledger that edits its own past
     numbers is not a ledger.
     NO ROW IS EVER REMOVED AND NO COLUMN IS SUMMED. A cancelled withdrawal keeps
     its place, and there is no total taken out, because a lifetime payout figure
     is a score and this node prints none. -->
