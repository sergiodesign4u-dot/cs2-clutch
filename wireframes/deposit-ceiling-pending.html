<!-- NODE 4.3, CEILING RAISE PENDING. THE OLD CEILING HOLDS UNTIL THEN, and
     that is the entire content of the state. It was in no flow until step 6 of the
     base layer, and without it a later stage would write the ceiling as
     instantaneous in both directions, which deletes the whole point of it.
     CANCELLING A PENDING RAISE IS A LOWERING, so it takes effect immediately, at
     any time, with no second wait. Derived, and drawn because nothing else in the
     repository says it.
     A PENDING RAISE DOES NOT FREEZE FUNDING. It only fails to enlarge it, so the
     form is here and works, inside the ceiling in force now.
     FORBIDDEN: no countdown as anticipation, and no "your new limit unlocks in",
     which frames a brake as a reward arriving. The raise taking effect is not an
     event worth announcing, and a notification that funding just got easier is the
     escalation loop with a scheduler attached. -->
