<!-- NODE 4.1 STEP 2, CRYPTO, D-96. The route with no amount field, and that
     absence is the whole design of this page.
     baseline-account.md 5b.3: a network selector, a QR code, an address with a
     copy control, a live rate, a promo bonus line and a minimum. Controls are
     PREVIOUS and DONE. THERE IS NO AMOUNT FIELD: the person sends what they send
     and the rate at the top is what it converts at.
     AND THAT BREAKS C2, WHICH IS THE FINDING OF THIS BUILD RATHER THAN A DETAIL.
     The spend ceiling's whole mechanism is that the amount just typed is
     pre-filled as a ceiling and the deposit cannot be submitted until the person
     accepts or changes it. NOTHING IS TYPED HERE AND NOTHING IS SUBMITTED. A
     person sends coins to an address and the money arrives whether a ceiling was
     accepted or not, so on this route the brake has nothing to hold and no
     moment to hold it in.
     THE PAGE STATES THAT RATHER THAN DRAWING A CEILING THAT CANNOT BIND. A
     pre-filled ceiling here would be a picture of a control, D-58, and worse than
     that: it would be a picture of a protection.
     WHAT COULD REPLACE IT IS A DECISION AND NOT A DRAWING. A ceiling enforced on
     arrival refuses money already sent, which means either holding it or
     returning it, and neither has a row, a policy or a node. Named, owner the
     founder, and not invented here.
     THE RATE IS A MARKET READ AND CARRIES AN AS-OF, unlike the peg. One coin is
     a dollar by our own fixed rate; what a Bitcoin is worth in dollars is not
     ours and moves, so rule 2 applies in full and this figure gets a time. -->
