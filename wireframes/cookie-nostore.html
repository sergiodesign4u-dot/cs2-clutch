  <!-- NODE 0.4, COOKIE CONSENT, DRAWN 22 AUGUST 2026, D-80.
       THE HOST IS HOME AND THAT IS THE ARGUMENT RATHER THAN A BACKDROP. This node
       fires on arrival, and the one property it has to demonstrate is that it is
       NOT A WALL: the page renders, scrolls and can be read with the answer still
       pending, and the cookie policy link works before consent is given. Drawn
       over a plain surface, that property would be a sentence. Drawn over the
       real Home, it is a fact a reviewer can scroll.
       ARTICLE 7(4) IS WHY. It makes conditionality a factor in whether consent is
       free at all, so a toll before reading is not a stricter banner, it is a
       weaker consent. And it is the only version compatible with B1-1: a visitor
       who arrived already suspecting the category cannot be charged for looking.
       THE PAGE IS A COPY OF THE GUEST HOME WITH THE REGION PINNED, which is how
       every state page of 3.3 and of 2.4 already works. The region itself is built
       once in _nav.js: eight copies of the one object this node exists for is how
       seven of them rot.
       TWO OF TWO IN THE CATEGORY SHIP ACCEPT ONLY. Hellcase and skin.club both run
       a banner with one control and the text "if you continue to use this site,
       you consent", walked 12 August 2026. Both halves fail, and against different
       texts: accept-only fails the symmetry the CNIL states, and consent by
       browsing fails recital 32 directly, "silence, pre-ticked boxes or inactivity
       should not therefore constitute consent". A reject button of the same size
       is the cheapest evidence in this whole product that B1-1's expectation is
       wrong, and it costs a button.
       NOINDEX, because the indexable document at this content is index.html and a
       copy of it with a consent region welded on is a duplicate. The region itself
       has no URL, no schema and no row in 0.13: it is not a page, and nobody
       navigates to it. -->

  <!-- STATE: STORAGE UNAVAILABLE, private mode or a blocked store. THIS STATE WAS
       IN THE NODE AND HAD NO PAGE UNTIL D-80. The dialog cannot remember, so it
       asks again, AND IT SAYS THAT THE CHOICE COULD NOT BE SAVED rather than
       silently re-asking. Silent re-asking is indistinguishable from a banner that
       ignores refusals, which is exactly the CNIL's third finding, so the one
       sentence here is what separates a browser limitation from our defect.
       THE RECORD ITSELF IS STRICTLY NECESSARY, and this state is why: a record of a
       refusal that cannot be stored produces a banner that asks forever. The
       exemption in Article 5(3) is what makes storing that one thing lawful without
       consent, and it is named in the strictly necessary row rather than assumed.
       NOTHING NON-ESSENTIAL FIRES IN THE MEANTIME and the page never breaks. -->
