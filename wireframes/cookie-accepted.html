  <meta name="robots" content="noindex">
  <!-- NODE 0.4, COOKIE CONSENT, DRAWN 22 AUGUST 2026, D-80.
       THE HOST IS HOME AND THAT IS THE ARGUMENT RATHER THAN A BACKDROP. This node
       fires on arrival, and the one property it has to demonstrate is that it is
       NOT A WALL: the page renders, scrolls and can be read with the answer still
       pending, and the cookie policy link works before consent is given. Drawn
       over a plain surface, that property would be a sentence. Drawn over the
       real Home, it is a fact a reviewer can scroll.
       ARTICLE 7(4) IS WHY. It makes conditionality a factor in whether consent is
       free at all, so a toll before reading is not a stricter banner, it is a
       weaker consent. And it is the only version compatible with B1-1: a visitor
       who arrived already suspecting the category cannot be charged for looking.
       THE PAGE IS A COPY OF THE GUEST HOME WITH THE REGION PINNED, which is how
       every state page of 3.3 and of 2.4 already works. The region itself is built
       once in _nav.js: eight copies of the one object this node exists for is how
       seven of them rot.
       TWO OF TWO IN THE CATEGORY SHIP ACCEPT ONLY. Hellcase and skin.club both run
       a banner with one control and the text "if you continue to use this site,
       you consent", walked 12 August 2026. Both halves fail, and against different
       texts: accept-only fails the symmetry the CNIL states, and consent by
       browsing fails recital 32 directly, "silence, pre-ticked boxes or inactivity
       should not therefore constitute consent". A reject button of the same size
       is the cheapest evidence in this whole product that B1-1's expectation is
       wrong, and it costs a button.
       NOINDEX, because the indexable document at this content is index.html and a
       copy of it with a consent region welded on is a duplicate. The region itself
       has no URL, no schema and no row in 0.13: it is not a page, and nobody
       navigates to it. -->
  <link rel="stylesheet" href="_wf.css">
</head>
<body>

<!-- The wireframe-only side panel. Rendered by wireframes/_nav.js. Screens and states
     only: the roadmap lives on overview.html. No status strip above the screen. -->
<button class="wfp-toggle" type="button" aria-label="Screens and states" aria-expanded="false">≡</button>
<aside id="wf-panel"></aside>

  <!-- STATE: ACCEPTED, REOPENED FROM THE FOOTER CONTROL. Every purpose on.
       WHY THIS IS DRAWN AS THE REOPENED DIALOG RATHER THAN AS A CLEARED PAGE: to
       the person, accepting and refusing produce the SAME page, and that identity
       is the point rather than a gap in the drawing. Refusing costs nothing except
       the analytics we would have collected, which is what Article 7(4) is
       measuring. The one place the two answers differ visibly is here, where the
       dialog reopens WITH THE CURRENT ANSWER SHOWN, NEVER BLANK.
       THE RECORD IS A BLOCK, not an implementation detail. Article 7(1): the
       controller shall be able to demonstrate that the data subject has consented.
       Demonstrating it to a regulator and showing it to the person are the same
       object, and the person is the harder reader. It carries the answer, when it
       was given, and WHICH VERSION OF THE POLICY it was given against, because a
       policy that changes silently invalidates the consent given under the old one:
       the same argument 0.9 makes for version history and 0.14 for the proof. -->
<div class="wf-screen-body" data-cookie="accepted">

  <!-- 0.1 NAVIGATION and 0.2 FOOTER are globals, rendered once by wireframes/_nav.js
       from window.WF_SHELL. Step 5: nobody redraws the header per screen. -->
  <div class="wf-shell" id="wf-shell"></div>

  <main class="wf-main">

    <!-- NODE 1.0, D-126: rendered once by homeBody() in _nav.js on Home, Home
         with an account and the eight cookie states. Order, blocks and reasons are
         in that function and in ia/docs/pages/home.md. -->
    <div data-home-body="guest"></div>

  </main>

  <footer class="wf-footer" id="wf-footer"></footer>

  <nav class="wf-bar" id="wf-bar"></nav>

</div>

<script>
window.WF_BASE = '';
window.WF_IA_BASE = '../ia/';
