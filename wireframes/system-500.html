<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something on our side failed</title>
  <link rel="stylesheet" href="_wf.css">
</head>
<body>

<!-- NODE 0.3, SYSTEM PAGES. Three failure surfaces on one template, and the
     template is the node: 404, 500 and 503 differ by which blocks are filled, never
     by which page somebody remembered to build.
     THE ONE RULE THAT DECIDES EVERYTHING BELOW: a response speaks to two readers, a
     person and a machine, and the status code is the machine-readable half of the
     sentence the body says to the person. The two never say different things. Both
     live failures walked on 12 August 2026 break exactly that rule and they break it
     in opposite directions: skin.club serves a correct 404 with a body that tells a
     person nothing they can act on, and Key-Drop serves HTTP 404 with the HOME PAGE
     rendered in it, no H1 and no error message anywhere, so the crawler is told the
     truth and the person is told the site is fine. A soft 404, HTTP 200 with a "not
     found" body, is the same defect from the third side.
     THAT IS WHY THE RESPONSE IS DRAWN. A wireframe that renders only the body cannot
     show any of the three failures, because all three are agreements between a body
     and a header. The block near the top of every one of these pages is the header
     half, written where a reviewer can read it against the words beside it.
     NEVER A DEAD END. The baseline's own 404 strips the shell: no rail, no header,
     no ticker, no footer, so a person who mistypes an address loses every route in
     the product except home. Ours keeps the shell and puts two routes in the BODY as
     well, because on a 500 the body is the part that is certain to render.
     THE FEED IS OFF ALL EIGHT PAGES, and the parent is this node's own sentence
     rather than a borrowed one: a live feed of other people's wins beside our own
     failure is the tone this product does not have. 0.8 section 3 carries the
     register of every surface that refuses it and the parent of each, D-79. -->

<!-- STATE: 500, WITH THE CARRIERS. Drawn twice, and this is the version where the
     shell is static enough to render. Both versions exist because the node's own
     open list says stage 04 draws both and then did not for four days: a conditional
     block drawn once is drawn in whichever condition the person drawing it assumed,
     and the other condition is discovered as a redraw.
     THE CARRIERS ARE HERE AND THE FIGURES INSIDE THEM ARE NOT. That pair is the whole
     point of this page. The rail and the header are markup; the money in the header
     comes from the application that just failed. So the carriers render and the two
     figures say NOT AVAILABLE, which is 0.11 rule 3. Rendering 0.00 on a page about
     money would be the cheapest possible lie and the most expensive one to be caught
     in on a platform whose first principle is that trust is the product.
     THE FOOTER IS THE ONE ROUTE OUT THAT IS CERTAINLY NOT BROKEN BY THIS FAILURE, and
     that is why B5 lives there rather than in the body: 0.10 exists for rapid contact
     and this is the page where a person most needs it. -->
<button class="wfp-toggle" type="button" aria-label="Screens and states" aria-expanded="false">&#8801;</button>
<aside id="wf-panel"></aside>

<div class="wf-screen-body">

  <div class="wf-shell" id="wf-shell"></div>

  <main class="wf-main">

    <div class="wf-sys" data-sys>
      <!-- B1. THE STATUS STATEMENT. The H1 is what happened IN WORDS and the numeral
           is secondary text above it. Key-Drop's 404 has no H1 at all, which is how a
           person reads a home page and learns nothing; skin.club spends its one line
           on a marketing sentence. The numeral is present because a person reporting
           this needs it, and it is never the heading.
           THE TITLE CARRIES THE SAME STATEMENT. It is what a person sees in the tab
           and in their history, and it is the one part of an error page that survives
           being left open in a background tab. -->
      <div class="wf-sys-head">
        <span class="wf-sys-code">500 &middot; Internal server error</span>
        <h1>Something on our side failed</h1>
      <p class="wf-sys-sub">You did nothing wrong. We already know this happened, and it is ours to fix.</p>
      </div>

      <!-- B2. ATTRIBUTION. The withdrawal clock's rule at the scale of the whole
           product: a wait with no owner is barrier B8-2, and an unattributed wait is
           what put T8 at the floor of the As-Is emotional map. On a 500 and on a 503
           the owner is always us, and the page says so in those words rather than in a
           passive sentence with nobody in it. -->
      <div class="wf-attr">
        <span class="wf-attr-h">Who this is waiting on</span>
        <span class="wf-attr-v">Us</span>
      </div>

      <!-- THE RESPONSE IS NOT PRINTED TO THE PERSON, FOUNDER DECISION OF 23 AUGUST
           2026. It used to render as three rows in the body, Status, Served at and
           Retry-After, and that is machine half of the sentence shown to the human
           half. D-66 forbids exactly this and the audit of 22 August raised it as
           process prose on the product surface; the founder raised it again looking
           at the drawn page. It is recorded here instead, where a reviewer reads it
           against the words beside it and a person never does.
           WHAT THE ROWS SAID, AND IT STILL HOLDS AS A SPECIFICATION:
             Status:     500 Internal Server Error
             Served at:  /cases/ironbound
             Retry-After: not sent. This is a failure rather than a wait with an end
           THE RESPONSE RENDERS AT THE ADDRESS THAT WAS REQUESTED, and that is the
           row nobody draws. A redirect to /404 would answer somewhere else, return
           a 200 or a 301 at a different URL, and take the mistyped address out of
           the browser bar along with any chance of correcting it. The address bar
           is where a person reads it, which is why the block was redundant as well
           as wrong: it printed what the browser already shows.
           NO NOINDEX ANYWHERE ON THESE PAGES. The status code is the instrument,
           not the meta tag. There are no error URLs to disallow in robots.txt
           because there are no error URLs. -->

      <!-- B6. THE REFERENCE, ON THE 500 ALONE. One short identifier a person can
           paste into a support ticket. A failure with no handle is a failure support
           cannot look up, which makes 0.10's published response deadline unmeetable.
           GENERATED AT THE EDGE, not by the failed application, or it does not exist.
           THE FORMAT IS [?] AND THE SHAPE IS NOT. Middle truncation with the full
           value always retrievable, never truncation at the end, which is 0.14
           section 5's rule for the hash generalised: the last characters are the half
           a person reads back over the phone. The whole string is in the DOM, so it is
           selectable and a screen reader reads all of it. -->
      <div class="wf-attr">
        <span class="wf-attr-h">Quote this if you get in touch</span>
        <div class="wf-ref">
          <span class="wf-mid"><span class="wf-mid-a">err-4f1c9a72-0d38-4b6e-9c51</span><span class="wf-mid-b">-a7b204ee31f8</span></span>
          <button class="wf-btn wf-btn--small" type="button" data-sys-copy="err-4f1c9a72-0d38-4b6e-9c51-a7b204ee31f8">Copy</button>
          <span class="wf-copied" role="status" aria-live="polite" data-sys-copied></span>
        </div>
      </div>

      <!-- NO SEARCH ON THIS PAGE, AND NO LIVE FIGURE. Both are absent for the same
           reason and it is the one line blocks.md writes for T8: an error page that
           needs the broken backend to render is not an error page. Search needs the
           index. The money figures in the header have no source, so they render as
           NOT AVAILABLE rather than as 0.00, which is 0.11 rule 3: missing is a state,
           never a zero. The footer's two live statistics take the same treatment, per
           0.2's own transient row, and the strip keeps its space rather than being
           removed: taking it away would remove the proof-of-scale half of "never a
           dead end" along with the figure.
           NO TEMPLATE ENGINE CALL, NO API CALL, NO DATABASE READ. This is a static
           document with its styling already cached. Design principle 5: a failure page
           that is itself slow says the failure is worse than it is. -->

      <!-- ONE WAY OUT, AND A SECOND ONE BESIDE IT. Two stacked cards carrying a
           name and a line of explanation each were a block of furniture on a page
           that exists to say one sentence. The destinations did not change: the
           node's transitions row is 1.0 and 3.1 and a carrier may not promise a
           destination the map does not hold.
           REAL <a href> AND ONE MAIN ACTION. Home is the primary, the shelf is
           beside it, and conventions.md 1.6 holds on this page again. -->
      <div class="wf-row">
        <a class="wf-btn wf-btn--primary" href="index.html">Home</a>
        <a class="wf-btn" href="catalogue.html">All cases</a>
      </div>
    </div>

  </main>

  <footer class="wf-footer" id="wf-footer"></footer>

  <nav class="wf-bar" id="wf-bar"></nav>

</div>

<script>
window.WF_BASE = '';
window.WF_IA_BASE = '../ia/';
window.WF_SHELL = { account: true, active: '', feed: false, money: false, stats: 'unavailable' };
</script>
<script src="_nav.js"></script>
</body>
</html>
