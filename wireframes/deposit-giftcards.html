<!-- NODE 4.1 STEP 2, GIFT CARDS, D-96. The one route of thirty five that leaves
     the product, and the page is mostly about saying so.
     baseline-account.md 5b.4, acct_deposit_giftcards.png: the tile opens six
     accordions, GIFT CARDS ON DIFMARK expanded then PULSE, KINGUIN, OFF GAMERS,
     KARTE DIREKT and ENEBA, each denomination carrying a BUY ON DIFMARK control.
     SO ONE FUNDING ROUTE IS A SET OF OUTBOUND PURCHASES ON SIX THIRD PARTY
     RESELLERS, and the baseline says nothing on that screen about what happens
     after, how long a code takes to credit, or who to ask if it does not.
     THAT SILENCE IS EXACTLY B4-3 WITH AN EXTRA PARTY IN IT. Money leaves and does
     not arrive is the barrier; here it leaves through someone we do not run,
     which means the person has two companies to ask and neither of them owes them
     an answer. C3 requires a named crediting window in the interface and this is
     the route where an absent one costs most.
     WHAT THIS PAGE ADDS TO THE BASELINE IS THE HANDOVER, STATED BEFORE THE PRESS.
     A person is about to leave, pay a company that is not us, and come back with
     a code. Every one of those three facts is on the page before any control.
     THE SIX RESELLERS ARE NAMED AND NOT DRAWN AS OURS. An outbound control says
     where it goes, D-19's rail defect in a different carrier: advertising a
     destination is a promise about the destination.
     THE DENOMINATIONS ARE THE BASELINE'S SIX, $5 to $200, the same ladder the
     card presets run, which is one fact rendered once rather than two ladders
     that drift. -->
<!-- REBUILT AS A HOST ON 25 AUGUST 2026, D-99. The body of this screen is
     rendered by _nav.js and is the same object the deposit dialog renders. It
     used to be markup written out here, and two of the six had already drifted:
     4.3 and 4.5 were copies of the card page taken before D-97 and never caught
     up, so they were missing the provider block, the receipt at the top of the
     dock and the billing block, and D-97 had found one more of the same class a
     day earlier. WHAT IS DECIDED HERE IS THE STATE AND THE FIGURES; the blocks
     and their order live in one place. -->
