<!-- NODE 4.5, PAYMENT DECLINED. THE CEILING AND THE THRESHOLD ARE PRESERVED
     THROUGH THE FAILURE, and that is not a convenience: a decline that reset the
     withdrawal threshold would let it come back higher, which is the rising
     threshold arriving through a failure path instead of through a policy.
     IF IT IS UNKNOWN WHETHER MONEY LEFT, THIS IS NOT THIS STATE. An unknown
     outcome is the crediting state with the window running, because the barrier
     under this cluster is precisely money that left with nothing to show for it.
     So this page asserts what it knows and says where the knowledge stops.
     THE AMOUNT IS EXACTLY AS TYPED. Never cleared, never rounded, never replaced.
     FORBIDDEN: no invented reason, because a decline reason we did not receive is
     not printed as though we had. NO SUGGESTED SMALLER AMOUNT and no pre-filled
     alternative of any kind: the number on this screen is the person's own, which
     is the property the ceiling rests its whole argument on, and a product that
     proposes a different one at the moment of failure has taken that back. No
     retry counter, no escalating prompt, and no alternative method promoted as
     more likely to work unless that is a fact we hold. -->
<!-- REBUILT AS A HOST ON 25 AUGUST 2026, D-99. The body of this screen is

     dock and the billing block, and D-97 had found one more of the same class a
     day earlier. WHAT IS DECIDED HERE IS THE STATE AND THE FIGURES; the blocks
     and their order live in one place. -->
